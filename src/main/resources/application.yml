spring:
  application:
    name: spring-boot

  datasource:
    url: jdbc:mysql://localhost:3306/spring-boot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: root
    password: 1q2w3e4r!

  data:
    redis:
      host: localhost
      port: 6379
      database: 0

  flyway:
    enabled: true
    locations: classpath:migration
    baseline-on-migrate: true
    clean-disabled: false
    clean-on-error: ${FLYWAY_CLEAN_ON_ERROR:true}

  messages:
    basename: messages/label_ko, messages/message_ko, messages/label_en, messages/message_en
    encoding: UTF-8
    fallback-to-system-locale: false
    always-use-message-format: true

  security:
    token-secret: ${SPRING_SECURITY_JWT_SECRET_VALUE:SPRING_SECURITY_JWT_SECRET_VALUE}
    access-token-expiration-millis: 300000 # 300000 # 5분
    refresh-token-expiration-millis: 3600000 # 1시간

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-handlers-package: coz.springboot.mybatis
  configuration:
    map-underscore-to-camel-case: true
    auto-mapping-behavior: full

app:
  client:
    base-url: http://localhost:3000