spring:
  application:
    name: spring-boot

  messages:
    basename: messages/label_ko, messages/message_ko, messages/label_en, messages/message_en
    encoding: UTF-8
    fallback-to-system-locale: false
    always-use-message-format: true

  security:
    expiration:
      access-token: 300000 # 300000 # 5분
      refresh-token: 3600000 # 1시간
    cookie:
      access-token: ACCESS_TOKEN
      refresh-token: REFRESH_TOKEN
    refresh-token-cookie-name: REFRESH_TOKEN

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-handlers-package: coz.springboot.typehandler
  configuration:
    map-underscore-to-camel-case: true
    auto-mapping-behavior: full
